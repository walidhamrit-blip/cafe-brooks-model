<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BROOKS CAFÉ — Nabeul | Specialty Coffee & À La Carte</title>
    <meta name="description" content="BROOKS Café Nabeul — Food • Chill • Good vibes. Specialty coffee, à la carte dining, brunch & signature desserts on the Cap Bon coast. Open daily 7:30 — 00:00. AFH2, Nabeul." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/assets/brand/brooks-badge.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/brooks-badge-192.png" />
    <link rel="apple-touch-icon" href="/assets/brand/brooks-badge-192.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BROOKS Café Nabeul — Pizza • Pasta • Food • Fruits" />
    <meta property="og:description" content="Food • Chill • Good vibes — ton spot préféré à Nabeul. Ouvert tous les jours 7h30 — 00h00. AFH2, Av. Habib Bourguiba, Nabeul." />
    <meta property="og:image" content="/assets/brand/brooks-badge-512.png" />
    <meta name="theme-color" content="#0E3B2B" />
    <script>
      /* Thème clair/sombre appliqué avant le premier paint (anti-flash).
         Mémoire → préférence système → clair. Même logique que dans App.tsx. */
      (function () {
        try {
          var s = localStorage.getItem("brooks-theme");
          var dark = s === "dark" || (s !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) { /* on garde le thème clair */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
